name: Release macOS

# The Mac's part of a release. The rest is built on Matheus's computer by
# `npm run release` (scripts/release.mjs, docs/releases.md), which publishes the
# Windows installers and the APK, leaves the desktop release as a draft and
# starts this:
#
#   gh workflow run release.yml --ref main -f tag=v0.X.Y
#
# This adds the Mac bundle to that draft, merges its entries into the
# `latest.json` already there, and only then takes the release out of draft.
#
# It runs on main, not on the tag, for the cache: GitHub only lets a run read
# caches saved on its own ref or on the default branch, so a run on a tag
# compiled Rust from nothing every time.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'A tag da release em rascunho (v0.X.Y)'
        required: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  mac:
    name: Empacota para macOS
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Confere a tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          config=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          if [ "$TAG" != "v$config" ]; then
            echo "::error::A tag diz $TAG e o tauri.conf.json diz $config. Elas têm que bater."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          # The test files die loading jsdom on Node 20, and the deploy runs 22.
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      # Saved under main (see the top), so each release starts from the one
      # before. The key leaves out the Cargo.lock change every version bump
      # makes, which would otherwise miss each time.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          shared-key: release

      - run: npm ci

      # Without this the macOS bundle ships with no `_CodeSignature` at all:
      # only the binary carries the linker's ad-hoc signature, and the bundle
      # around it carries none. `codesign --verify` then fails outright, and
      # the Mac that opens it is told the app is damaged and should go to the
      # Trash, with no way past it. Signing the whole bundle ad-hoc makes the
      # signature valid, which downgrades that to the ordinary warning about
      # an unidentified developer, the one with "Open Anyway" behind it.
      #
      # This is not notarisation and does not pretend to be. With an Apple
      # Developer ID in the secrets, tauri-action signs and notarises instead,
      # and this step has nothing left to repair.
      - name: Assina o bundle do macOS
        run: echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"

      # Finds the draft by its tag, uploads into it, and merges its platforms
      # into the latest.json the Windows side left there.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Without these the bundle step fails outright, because the config
          # asks for updater artifacts and an unsigned one would be refused by
          # every app it reached.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # The servers this build talks to (apps/desktop/.env.example); kept out of the code.
          VITE_SYNC_SERVER: ${{ secrets.SYNC_SERVER_URL }}
          VITE_FEEDBACK_KIT_URL: ${{ secrets.FEEDBACK_KIT_URL }}
        with:
          projectPath: apps/desktop
          tagName: ${{ inputs.tag }}
          releaseName: Markdown Viewer __VERSION__
          releaseBody: Baixe abaixo o pacote do seu sistema.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: '--target aarch64-apple-darwin'

      # Only now does `releases/latest/download/latest.json` start answering,
      # and by now every file it names is in place.
      #
      # Marked latest by name: the phone's releases live in the same
      # repository and must never take that place.
      - name: Tira a release do rascunho
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: gh release edit "$TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
