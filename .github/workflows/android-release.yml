name: Release Android

# The phone's APK, signed with the keystore shared by all of Matheus's Android
# apps, published as a release the app finds and installs by itself (the OTA
# runbook in the vault: "Update OTA de app Android pelo GitHub Releases").
#
# The APK of each version is built on Matheus's computer by `npm run release`
# (scripts/release.mjs), in seconds instead of a quarter of an hour. This is the
# fallback for when that computer is not at hand: Actions > Release Android >
# Run workflow puts out an APK of main.

on:
  workflow_dispatch:

jobs:
  apk:
    name: APK assinado
    runs-on: ubuntu-latest
    # Two at once could publish out of order, and the app would be offered the
    # older build last.
    concurrency:
      group: android-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # An APK signed with any other key never installs over the one on the
      # phone, so a missing secret stops here instead of publishing one.
      - name: Confere os secrets
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Faltam KEYSTORE_B64 ou KEYSTORE_PASSWORD nos secrets do repositório."
            exit 1
          fi

      # The build number (versionCode) is the minutes since 2026, the same
      # count `npm run phone` and `npm run release` use: it only grows, whoever
      # builds, so an APK from either side installs over the other and the
      # update check sees the newest as newest.
      - name: Número do build
        run: echo "VERSION_CODE=$(( ($(date +%s) - 1767225600) / 60 ))" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Gradle's downloads and its build cache, saved from main only, so each
      # release starts from the one before.
      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Gera o projeto Android
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      # The S25 Ultra and the Tab S10 FE are both arm64: one architecture keeps
      # the build and the APK small.
      - name: Compila o APK
        working-directory: apps/mobile/android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --build-cache

      - name: Publica a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./apps/mobile/app.json').expo.version")
          apk="markdown-viewer-$VERSION_CODE.apk"
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "$apk"
          # Never "latest": that is the desktop's, whose updater reads releases/latest.
          gh release create "android-v$version-$VERSION_CODE" "$apk" \
            --target "$GITHUB_SHA" \
            --title "Android $version ($VERSION_CODE)" \
            --notes "$(git log -1 --format=%s)" \
            --latest=false
