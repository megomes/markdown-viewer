name: Release Android

# The phone's APK, signed with the keystore shared by all of Matheus's Android
# apps, published as a release the app finds and installs by itself (the OTA
# runbook in the vault: "Update OTA de app Android pelo GitHub Releases").
#
# It goes out with the same version tag as the desktop (docs/releases.md), not
# on every push: pushes here are frequent, and each would become an install.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Two runs at once could publish out of order, and the app would be offered
# the older build last.
concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  apk:
    name: APK assinado
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      # An APK signed with any other key never installs over the one on the
      # phone, so a missing secret stops here instead of publishing one.
      - name: Confere os secrets
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Faltam KEYSTORE_B64 ou KEYSTORE_PASSWORD nos secrets do repositório."
            exit 1
          fi

      - name: Confere se a tag bate com a versão do app
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          app=$(node -p "require('./apps/mobile/app.json').expo.version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$app" != "$tag" ]; then
            echo "::error::A tag diz $tag e o apps/mobile/app.json diz $app. Elas têm que bater."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      - name: Keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Gera o projeto Android
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      # The S25 Ultra and the Tab S10 FE are both arm64: one architecture keeps
      # the build and the APK small.
      - name: Compila o APK
        working-directory: apps/mobile/android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Publica a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./apps/mobile/app.json').expo.version")
          apk="markdown-viewer-$VERSION_CODE.apk"
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "$apk"
          # Never "latest": that is the desktop's, whose updater reads releases/latest.
          gh release create "android-v$version-$VERSION_CODE" "$apk" \
            --target "$GITHUB_SHA" \
            --title "Android $version ($VERSION_CODE)" \
            --notes "$(git log -1 --format=%s)" \
            --latest=false
