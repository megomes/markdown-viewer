<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>markdown-viewer</title>
    <!--
      The colour of the theme before any CSS or JavaScript arrives, so the window
      never shows white while the app loads. Only the app's own window, and not on
      Windows: the panels on the edge of the screen, and the Windows main window,
      are transparent and must stay so.
    -->
    <script>
      ;(function () {
        try {
          var label =
            window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.metadata
              ? window.__TAURI_INTERNALS__.metadata.currentWindow.label
              : 'main'
          if (label !== 'main' || /[?&]window=/.test(location.search)) return
          // On Windows the main window is created transparent, with round corners
          // the interface draws (tauri.windows.conf.json): a background here would
          // fill the corners in. It needs none, because it stays hidden until the
          // app's first paint.
          if (window.__TAURI_INTERNALS__ && /Windows/.test(navigator.userAgent)) {
            document.documentElement.dataset.transparent = 'true'
            return
          }
          var mode =
            JSON.parse(localStorage.getItem('markdown-viewer.settings') || '{}').themeMode ||
            'system'
          var dark =
            mode === 'dark' ||
            (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.style.background = dark ? '#080811' : '#e9e9f0'
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
